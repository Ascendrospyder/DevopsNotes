<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Production Web Server</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 40px; background: #f8fafc; color: #1e293b; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); max-width: 600px; margin: auto; }
        .badge { background: #10b981; color: white; padding: 4px 12px; border-radius: 9999px; font-weight: bold; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">Puppet Managed Node</span>
        <h1>Infrastructure Automated Successfully</h1>

    </div>
