---
version: 5
defaults:
  datadir: data
  data_hash: yaml_data

hierarchy:
  - name: "Per-Node Data"
    path: "nodes/%{trusted.certname}.yaml"

  - name: "Per-Environment Data"
    path: "environment/%{environment}.yaml"

  - name: "Per-OS Family Data"
    path: "os/%{facts.os.family}.yaml"

  - name: "Global Common Defaults"
    path: "common.yaml"
